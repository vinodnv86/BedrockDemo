<template>
    <lightning-card title="Object Actions">

        <!-- TABLE -->
        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
            <thead>
                <tr>
                    <th>Object</th>
                    <th>View</th>
                    <th>Create</th>
                    <th>Update</th>
                </tr>
            </thead>

            <tbody>
                <template for:each={rows} for:item="row">
                    <tr key={row.id}>
                        <td>{row.label}</td>

                        <!-- View Button -->
                        <td>
                            <template if:true={row.access.view}>
                                <lightning-button 
                                    label="View"
                                    variant="brand-outline"
                                    data-api={row.api}
                                    data-action="view"
                                    onclick={handleAction}>
                                </lightning-button>
                            </template>
                        </td>

                        <!-- Create Button -->
                        <td>
                            <template if:true={row.access.create}>
                                <lightning-button 
                                    label="Create"
                                    variant="brand-outline"
                                    data-api={row.api}
                                    data-action="create"
                                    onclick={handleAction}>
                                </lightning-button>
                            </template>
                        </td>

                        <!-- Update Button -->
                        <td>
                            <template if:true={row.access.update}>
                                <lightning-button 
                                    label="Update"
                                    variant="brand-outline"
                                    data-api={row.api}
                                    data-action="update"
                                    onclick={handleAction}>
                                </lightning-button>
                            </template>
                        </td>

                    </tr>
                </template>
            </tbody>
        </table>


        <!-- MODAL WINDOW -->
        <template if:true={showModal}>
            <section class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">

                    <!-- Header -->
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">{modalTitle}</h2>
                    </header>

                    <!-- CONTENT -->
                    <div class="slds-modal__content slds-p-around_medium">

                        <!-- HIERARCHY VIEW -->
                        <template if:true={isHierarchy}>
                            <c-hierarchy-viewer 
                                record-id={recordId}
                                object-api-name={currentObjectApiName}>
                            </c-hierarchy-viewer>
                        </template>

                        <!-- RECORD FORM (VIEW / CREATE / UPDATE) -->
                     <!-- RECORD FORM (VIEW / CREATE / UPDATE) -->
<template if:false={isHierarchy}>
    <template if:true={modalFields}>
        <lightning-record-edit-form
            object-api-name={modalObjectApi}
            record-id={modalRecordId}
            mode={formMode}
        >

            <!-- Dynamic Fields -->
            <template for:each={modalFields} for:item="f">
                <lightning-input-field 
                    key={f}
                    field-name={f}>
                </lightning-input-field>
            </template>

            <!-- Show Save button only for Create / Update -->
            <template if:true={isEditMode}>
                <div class="slds-m-top_medium">
                    <lightning-button 
                        variant="brand" 
                        type="submit" 
                        label="Save">
                    </lightning-button>
                </div>
            </template>

        </lightning-record-edit-form>
    </template>

     <!-- TASK CREATE TEMPLATE -->
                        <template if:true={isTaskCreate}>
                            <lightning-input 
                                label="Subject"
                                value={subject}
                                onchange={handleSubjectChange}>
                            </lightning-input>

                            <lightning-input 
                                type="date"
                                label="Due Date"
                                value={dueDate}
                                onchange={handleDueDateChange}>
                            </lightning-input>

                            <div class="slds-m-top_medium">
                                <lightning-button 
                                    label="Create Task"
                                    variant="brand"
                                    onclick={handleCreateTask}>
                                </lightning-button>
                            </div>
                        </template>
</template>


                    </div>

                    <!-- FOOTER -->
                    <footer class="slds-modal__footer">
                        <lightning-button 
                            label="Close" 
                            onclick={closeModal}>
                        </lightning-button>
                    </footer>

                </div>
            </section>

            <!-- BACKDROP -->
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </lightning-card>
</template>
