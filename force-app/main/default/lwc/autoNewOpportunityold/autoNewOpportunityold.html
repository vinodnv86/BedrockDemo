<template>
    <lightning-card title="New Opportunity" icon-name="standard:opportunity">
        <div class="slds-p-around_medium">
            <lightning-record-edit-form
                object-api-name={objectApiName}
                onsuccess={handleSuccess}>

                <!-- Prefill Account if available -->
                <lightning-input-field field-name={ACCOUNT_FIELD} value={recordId}></lightning-input-field>

                <!-- Prefill Name with current Date + Time -->
                <lightning-input-field field-name={NAME_FIELD} value={defaultName}></lightning-input-field>

                <!-- Add other common fields -->
                <lightning-input-field field-name={STAGE_FIELD}></lightning-input-field>
                <lightning-input-field field-name={CLOSEDATE_FIELD}></lightning-input-field>

                <div class="slds-m-top_medium">
                    <lightning-button variant="brand" type="submit" label="Save"></lightning-button>
                    <lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
                </div>
            </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
